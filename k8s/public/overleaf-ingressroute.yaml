---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: overleaf-oauth2-forwardauth
  namespace: public
spec:
  forwardAuth:
    address: http://oauth2-proxy.overleaf.svc.cluster.local:4180/ouath2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth_Request-User
      - X-Auth-Request-Email
      - Set-Cookie
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: overleaf
  namespace: public
spec:
  entryPoints:
    - websecure
  routes:
    # Höhere Priorität - muss vor der Catch-All-Regel unten matchen.
    # Das ist der Login-Callback-Flow selbst, läuft OHNE die
    # forwardAuth-Middleware (sonst Henne-Ei-Problem: Auth-Check würde den
    # Auth-Callback selbst blockieren).
    - match: Host(`overleaf.svc.johannesmoseler.de`) && PathPrefix(`/oauth2/`)
      kind: Rule
      priority: 20
      services:
        - name: oauth2-proxy
          namespace: overleaf
          port: 4180
    - match: Host(`overleaf.svc.johannesmoseler.de`)
      kind: Rule
      priority: 10
      middlewares:
        - name: overleaf-oauth2-forwardauth
      services:
        - name: overleaf
          namespace: overleaf
          port: 80
  tls:
    secretName: svc-wildcard-tls