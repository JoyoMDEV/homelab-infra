---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth
  namespace: public
spec:
  forwardAuth:
    address: http://authelia.public.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
# Nur noch EINE Route - kein separater /oauth2/-Callback-Pfad mehr nötig:
# Authelias Session-Cookie gilt für die ganze svc.johannesmoseler.de-Domain,
# der Login läuft komplett auf login.svc.johannesmoseler.de selbst ab.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: overleaf
  namespace: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`overleaf.svc.johannesmoseler.de`)
      kind: Rule
      middlewares:
        - name: authelia-forwardauth
      services:
        - name: overleaf
          namespace: overleaf
          port: 80
  tls:
    secretName: svc-wildcard-tls
