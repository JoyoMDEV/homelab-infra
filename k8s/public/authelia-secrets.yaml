---
# Vault-Pfad manuell befüllen:
#   vault kv put secret/homelab/public/authelia-secrets \
#     jwt-secret="$(openssl rand -hex 32)" \
#     session-secret="$(openssl rand -hex 32)" \
#     storage-encryption-key="$(openssl rand -hex 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: public
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: homelab/public/authelia-secrets
        property: jwt-secret
    - secretKey: session_secret
      remoteRef:
        key: homelab/public/authelia-secrets
        property: session-secret
    - secretKey: storage_encryption_key
      remoteRef:
        key: homelab/public/authelia-secrets
        property: storage-encryption-key
---
# Vault-Pfad manuell befüllen - Passwort-Hash erzeugen mit:
#   docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password 'DEIN-PASSWORT'
# (gibt einen $argon2id$... Hash aus, den unten reinkopieren)
#
#   vault kv put secret/homelab/public/authelia-users \
#     users_database.yml="$(cat <<'EOF'
# users:
#   admin:
#     displayname: "Admin"
#     password: "$argon2id$v=19$m=65536,t=3,p=4$..."
#     email: admin@johannesmoseler.de
# EOF
# )"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: public
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authelia-users
    creationPolicy: Owner
  data:
    - secretKey: users_database.yml
      remoteRef:
        key: homelab/public/authelia-users
        property: users_database.yml
