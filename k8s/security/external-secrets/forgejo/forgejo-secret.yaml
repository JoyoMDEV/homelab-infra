# Seed with scripts/setup-forgejo.sh (generates both values, writes to Vault).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: forgejo-secret
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: homelab/forgejo/forgejo-secret
        property: secret-key
    - secretKey: internal-token
      remoteRef:
        key: homelab/forgejo/forgejo-secret
        property: internal-token
