# Seed with scripts/setup-forgejo-backup.sh (creates the Garage bucket
# forgejo-backups plus a key scoped to it, writes the key to Vault). Read by
# the forgejo-backup CronJob (k8s/charts/forgejo/templates/backup-cronjob.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-backup-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: forgejo-backup-secret
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: homelab/forgejo/forgejo-backup-secret
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: homelab/forgejo/forgejo-backup-secret
        property: secret-access-key
