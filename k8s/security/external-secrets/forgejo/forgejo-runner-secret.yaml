# Seed with scripts/setup-forgejo-runner.sh (registers the runner in Forgejo
# and writes uuid + token to Vault). Read by the forgejo-runner Deployment
# (k8s/charts/forgejo/templates/runner.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secret
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
  data:
    - secretKey: uuid
      remoteRef:
        key: homelab/forgejo/forgejo-runner-secret
        property: uuid
    - secretKey: token
      remoteRef:
        key: homelab/forgejo/forgejo-runner-secret
        property: token
