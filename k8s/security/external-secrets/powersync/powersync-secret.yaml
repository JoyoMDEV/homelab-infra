apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: powersync-secret
  namespace: powersync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: powersync-secret
    creationPolicy: Owner
  data:
    - secretKey: PS_DATA_SOURCE_URI
      remoteRef:
        key: homelab/powersync/powersync-secret
        property: data-source-uri
    - secretKey: PS_STORAGE_URI
      remoteRef:
        key: homelab/powersync/powersync-secret
        property: storage-uri
    # Reuses Supabase's existing JWT secret rather than duplicating it into
    # a second Vault path - see scripts/setup-supabase.sh, which is the
    # script that originally seeds homelab/supabase/supabase-secret.
    - secretKey: PS_JWT_SECRET
      remoteRef:
        key: homelab/supabase/supabase-secret
        property: jwt-secret
