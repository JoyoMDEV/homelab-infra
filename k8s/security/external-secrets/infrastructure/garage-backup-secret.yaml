# Garage S3 credentials for CNPG (Barman) backups. Seeded by
# scripts/setup-garage-backups.sh. 'region' is not secret, it is Garage's
# fixed s3_region and is merged in so barman can sign requests correctly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-backup-secret
  namespace: infrastructure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garage-backup-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        region: garage
  data:
    - secretKey: access-key-id
      remoteRef:
        key: homelab/infrastructure/garage-backup-secret
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: homelab/infrastructure/garage-backup-secret
        property: secret-access-key
