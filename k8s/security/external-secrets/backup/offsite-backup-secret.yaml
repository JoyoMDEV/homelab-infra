# Seed with scripts/setup-offsite-backup.sh. Read by the offsite-backup
# CronJob (k8s/infrastructure/offsite-backup.yaml, context-hub#36).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offsite-backup-secret
  namespace: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: offsite-backup-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homelab/backup/offsite-backup-secret
