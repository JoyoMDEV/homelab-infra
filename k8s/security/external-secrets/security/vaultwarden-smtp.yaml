apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-smtp
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    # Own Secret, not the chart's: with release name "vaultwarden" the chart
    # renders a Secret called "vaultwarden" itself (Yubico/Duo/Push keys), and
    # both writing the same object kept the app OutOfSync.
    name: vaultwarden-smtp
    creationPolicy: Owner
  data:
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: homelab/security/vaultwarden-smtp
        property: SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: homelab/security/vaultwarden-smtp
        property: SMTP_PASSWORD
