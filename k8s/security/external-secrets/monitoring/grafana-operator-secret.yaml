# Grafana Service Account token for grafana-operator (dashboard-as-code).
# Grafana here is OIDC-only with no static admin password, so this can't be
# minted via the API with the existing coder-mcp service account (which is
# deliberately scoped to Viewer/Editor, no serviceaccounts:write) - create
# it manually once:
#   Grafana -> Administration -> Users and access -> Service accounts
#   -> New service account "grafana-operator", role "Editor"
#   -> Add service account token -> copy it into scripts/setup-grafana-operator.sh
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-operator-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-operator-secret
    creationPolicy: Owner
  data:
    - secretKey: GF_API_TOKEN
      remoteRef:
        key: homelab/monitoring/grafana-operator-secret
        property: GF_API_TOKEN
