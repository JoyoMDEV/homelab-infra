apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-cache-secret
  namespace: gitlab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-cache-secret
    creationPolicy: Owner
  data:
    # Key names match what the gitlab-runner chart's runners.cache.secretName
    # mechanism expects on the Kubernetes Secret (accesskey/secretkey) - not
    # this repo's usual access-key-id/secret-access-key convention, which is
    # only used for the underlying Vault properties below.
    - secretKey: accesskey
      remoteRef:
        key: homelab/gitlab/runner-cache-secret
        property: access-key-id
    - secretKey: secretkey
      remoteRef:
        key: homelab/gitlab/runner-cache-secret
        property: secret-access-key
