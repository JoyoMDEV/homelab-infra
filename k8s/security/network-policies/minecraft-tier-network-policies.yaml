---
# Analog zu k8s/security/network-policies/public-tier.yaml (public/overleaf) -
# gleiches additive Cilium-Modell: default-deny als Sicherheitsnetz, dann
# explizite Allow-Regeln pro Pod.

# ── Sicherheitsnetz: alles in "minecraft", das nicht explizit unten
#    erfasst ist, defaultet auf komplett zu. ────────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minecraft-default-deny
  namespace: minecraft
spec:
  endpointSelector: {}
  ingress: []
  egress: []

---
# ── Minecraft-Server (+ rcon-web-admin-Sidecar, selber Pod): Ingress bewusst
#    "all" statt podSelector auf Traefik - exakt dieselbe Begründung wie bei
#    authelia/overleaf-app in public-tier.yaml: hostNetwork-Traffic von
#    Traefik (sowohl traefik-public als auch das k3s-eigene interne Traefik -
#    beide laufen mit hostNetwork: true, per kubectl verifiziert) wird von
#    Cilium nicht zuverlässig als fromEndpoints erkannt (kubeProxyReplacement
#    =false, gleiche Ursache wie GitLab-SSH-Vorfall). Die eigentliche
#    Zugriffskontrolle läuft hier ohnehin über Hetzner-Firewall + UFW +
#    Traefik-IPAllowList + Minecraft-Spieler-Whitelist (bzw. rcon-web-admins
#    eigenen Login für dessen Web-UI), nicht über diese L3/L4-Policy.
#
#    toPorts grenzt trotzdem genau ein, WELCHE Ports das betrifft: 25565
#    (Spiel) und 4326/4327 (rcon-web-admin-Web-UI + dessen Websocket, siehe
#    minecraft-rcon-ingress.yaml). RCON selbst (25575) bekommt WEITERHIN
#    keine eigene Regel - braucht keine, weil rcon-web-admin als Sidecar im
#    selben Pod läuft und darüber nur per localhost spricht; Cilium sieht
#    Pod-interne Container-zu-Container-Kommunikation gar nicht erst, die
#    default-deny-Baseline oben greift also gar nicht dafür. Damit bleibt
#    RCON de facto nie von außerhalb dieses Pods erreichbar.
#
#    Egress: DNS + "world" - Modrinth-/CurseForge-Mod-Downloads beim Start
#    und Mojang-Session-Auth (ONLINE_MODE) brauchen offenes Internet, exakt
#    dieselbe Begründung wie bei overleaf-app (LaTeX-Paket-Nachladen).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minecraft-app
  namespace: minecraft
spec:
  endpointSelector:
    matchLabels:
      app: minecraft
  ingress:
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "4326"
              protocol: TCP
            - port: "4327"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world

---
# ── Fileshare (Modpack-Download): Ingress "all" statt podSelector auf
#    Traefik - gleicher Grund wie bei authelia/minecraft-app: das
#    hostNetwork-Erkennungsproblem betrifft ALLE Entrypoints von
#    traefik-public, nicht nur den TCP-Passthrough (Authelia hängt auch am
#    normalen websecure-Entrypoint und brauchte trotzdem "all" - hätte ich
#    mir beim ersten Entwurf hier gleich denken können). Perimeter läuft
#    über HTTPS + BasicAuth, nicht über diese L3/L4-Policy. Kein
#    Internet-Egress nötig (reiner Static-File-Server), daher nur DNS. ────
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minecraft-fileshare
  namespace: minecraft
spec:
  endpointSelector:
    matchLabels:
      app: minecraft-fileshare
  ingress:
    - fromEntities:
        - all
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
