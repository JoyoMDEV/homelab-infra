---
# ClusterSecretStore: Verbindet External Secrets Operator mit Vault.
# Nutzt Kubernetes ServiceAccount Auth – der ESO-ServiceAccount authentifiziert
# sich per eigenen Token gegen die Vault Kubernetes Auth Method.
#
# VORAUSSETZUNGEN:
# - Vault läuft und ist konfiguriert: ./scripts/setup-vault.sh
# - External Secrets Operator läuft: kubectl get pods -n external-secrets
# - Vault Kubernetes Role 'external-secrets' existiert (wird von setup-vault.sh erstellt)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "http://vault.security.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"

---
# Demo ExternalSecret: Zeigt wie ein Vault Secret → Kubernetes Secret wird.
# secret/homelab/test/demo → Namespace 'security', Secret 'vault-demo'
#
# Testen:
#   kubectl get secret vault-demo -n security -o jsonpath='{.data.hello}' | base64 -d
#   → world
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-demo
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: vault-demo
    creationPolicy: Owner
  data:
    - secretKey: hello
      remoteRef:
        key: homelab/test/demo
        property: hello
