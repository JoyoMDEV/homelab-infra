---
# STAGING zuerst nutzen (siehe Kommentar unten) - Prod-ClusterIssuer erst
# verwenden, wenn ein Zertifikat über staging erfolgreich durchgelaufen ist.
# Let's Encrypt Prod hat scharfe Rate-Limits, Staging nicht.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: contact@johannesmoseler.de
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.johannesmoseler.de
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: hetzner-dns-token
                key: token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: contact@johannesmoseler.de
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.johannesmoseler.de
            solverName: hetzner
            config:
              tokenSecretKeyRef:
                name: hetzner-dns-token
                key: token
