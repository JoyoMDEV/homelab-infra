---
# Traefik HelmChartConfig for k3s
# - hostPort 80/443
# - HTTP -> HTTPS redirect
# - TLS cert assignment is handled separately by traefik-tlsstore.yaml
#   (TLSStore CRD, secret copied to kube-system by bootstrap-certmanager.sh)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    deployment:
      kind: DaemonSet
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    hostNetwork: true
    # Ohne ClusterFirstWithHostNet würde der Pod das Host-eigene /etc/resolv.conf
    # nutzen statt CoreDNS - Traefik braucht aber Cluster-DNS, um Backend-Services
    # per Namen zu erreichen.
    dnsPolicy: ClusterFirstWithHostNet
    ports:
      web:
        port: 80
        redirectTo:
          port: websecure
          priority: 10
      websecure:
        port: 443
        tls:
          enabled: true
      # Ersetzt das k8s-native "hostPort: 2222" im GitLab-Omnibus-Deployment,
      # das seit dem Wechsel zu Cilium (kubeProxyReplacement: false -> Ciliums
      # hostPort-BPF-Datapath bleibt inaktiv) nicht mehr funktioniert. Traefik
      # bindet den Port ganz normal über sein bestehendes hostNetwork - kein
      # CNI-hostPort-Mechanismus mehr im Spiel. Kein TLS hier: SSH macht seine
      # eigene Verschlüsselung, das ist reines TCP-Passthrough.
      ssh:
        port: 2222
        protocol: TCP
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
    # NODE_IP = die Tailscale-IP dieses Nodes (k3s wurde mit --node-ip auf
    # die Tailscale-Adresse gestartet, siehe ansible/roles/k3s_server und
    # k3s_agent - Kubernetes kennt sie also pro Node schon als "die" IP).
    # $(NODE_IP) wird von Kubernetes selbst in "args" ersetzt (kein Shell-
    # Trick nötig). Bindet web/websecure NUR an die Tailscale-IP statt an
    # 0.0.0.0 - schließt damit die am Anfang gefundene Lücke (internes
    # Traefik war technisch über die öffentliche IP von CX53 erreichbar) UND
    # macht gleichzeitig Platz für die zweite, öffentliche Traefik-Instanz,
    # die genau diesen Wildcard-Bind sonst blockiert (siehe "address already
    # in use" im Chat-Verlauf).
    env:
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    additionalArguments:
      - "--entryPoints.web.address=$(NODE_IP):80/tcp"
      - "--entryPoints.websecure.address=$(NODE_IP):443/tcp"
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        allowExternalNameServices: true
