---
# Traefik HelmChartConfig for k3s
# - hostPort 80/443
# - HTTP -> HTTPS redirect
# - TLS cert assignment is handled separately by traefik-tlsstore.yaml
#   (TLSStore CRD, secret copied to kube-system by bootstrap-certmanager.sh)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    deployment:
      kind: DaemonSet
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    hostNetwork: true
    # Ohne ClusterFirstWithHostNet würde der Pod das Host-eigene /etc/resolv.conf
    # nutzen statt CoreDNS - Traefik braucht aber Cluster-DNS, um Backend-Services
    # per Namen zu erreichen.
    dnsPolicy: ClusterFirstWithHostNet
    ports:
      web:
        port: 80
        redirectTo:
          port: websecure
          priority: 10
      websecure:
        port: 443
        tls:
          enabled: true
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        allowExternalNameServices: true
