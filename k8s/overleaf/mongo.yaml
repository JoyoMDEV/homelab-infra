---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overleaf-mongo-data
  namespace: overleaf
spec:
  resources:
    requests:
      storage: 10Gi
  accessModes:
    - ReadWriteOnce
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf-mongo
  namespace: overleaf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overleaf-mongo
  template:
    metadata:
      labels:
        app: overleaf-mongo
    spec:
      # Default (30s) ist knapp für Mongo - bei zu kurzer Grace Period
      # kann SIGKILL statt eines sauberen Shutdowns kommen, das den
      # Replica-Set-Zustand (local.system.replset) korrumpieren kann.
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: mongo:8.0
          args: ["--replSet", "overleaf"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          # Prüft nicht nur, ob Mongo antwortet (ping antwortet auch im
          # kaputten RSGhost-Zustand mit OK), sondern ob das Replica-Set
          # tatsächlich gesund ist und dieses Mitglied PRIMARY ist.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "rs.status().ok === 1 && rs.status().members[0].stateStr === 'PRIMARY' ? quit(0) : quit(1)"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: overleaf-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: overleaf-mongo
  namespace: overleaf
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: overleaf-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: batch/v1
kind: Job
metadata:
  name: overleaf-mongo-init-replicaset
  namespace: overleaf
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z overleaf-mongo 27017; do echo waiting for mongo; sleep 2; done
      containers:
        - name: init-replicaset
          image: mongo:8.0
          command:
            - mongosh
            - --host
            - overleaf-mongo
            - --eval
            - >
              try {
                const status = rs.status();
                if (status.members[0].stateStr !== "PRIMARY") {
                  throw new Error("not primary, forcing reconfig");
                }
                print("replica set healthy, nothing to do");
              } catch (e) {
                try {
                  rs.initiate({_id: "overleaf", members: [{_id: 0, host: "overleaf-mongo:27017"}]});
                  print("replica set initiated");
                } catch (e2) {
                  const cfg = rs.conf();
                  cfg.version += 1;
                  rs.reconfig(cfg, {force: true});
                  print("replica set force-reconfigured");
                }
              }

