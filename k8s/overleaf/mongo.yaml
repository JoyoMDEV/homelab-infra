---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overleaf-mongo-data
  namespace: overleaf
spec:
  resources:
    requests:
      storage: 10Gi
  accessModes:
    - ReadWriteOnce
---
# StatefulSet instead of Deployment (context-hub#42): the pod is always
# overleaf-mongo-0, and the old pod is gone before the new one starts.
# The replica set member is the pod's own FQDN. Before mongod starts, an init
# container waits until that name resolves to this pod's IP. Without that,
# mongod's startup "isSelf" check could hit the previous pod's IP, mark the
# node REMOVED and never recover on its own (21 days of Overleaf downtime,
# see context-hub homelab-infra/references/overleaf-mongo-replicaset-stale-ip.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: overleaf-mongo
  namespace: overleaf
spec:
  serviceName: overleaf-mongo
  replicas: 1
  selector:
    matchLabels:
      app: overleaf-mongo
  template:
    metadata:
      labels:
        app: overleaf-mongo
    spec:
      # Default (30s) ist knapp für Mongo - bei zu kurzer Grace Period
      # kann SIGKILL statt eines sauberen Shutdowns kommen, das den
      # Replica-Set-Zustand (local.system.replset) korrumpieren kann.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-own-dns
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              NAME=overleaf-mongo-0.overleaf-mongo.overleaf.svc.cluster.local
              # Exact match on the address lines only (10.42.1.25 must not
              # match a stale 10.42.1.252), skipping the resolver's own line.
              until nslookup "$NAME" 2>/dev/null | sed -n '/^Name:/,$p' | grep -qx "Address: *$POD_IP"; do
                echo "waiting for $NAME -> $POD_IP"; sleep 2
              done
              echo "$NAME resolves to $POD_IP"
      containers:
        - name: mongo
          image: mongo:8.0
          args: ["--replSet", "overleaf"]
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          # Prüft nicht nur, ob Mongo antwortet (ping antwortet auch im
          # kaputten RSGhost-Zustand mit OK), sondern ob das Replica-Set
          # tatsächlich gesund ist und dieses Mitglied PRIMARY ist.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "rs.status().ok === 1 && rs.status().members[0].stateStr === 'PRIMARY' ? quit(0) : quit(1)"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        # Existing PVC (data stays), not a volumeClaimTemplate.
        - name: data
          persistentVolumeClaim:
            claimName: overleaf-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: overleaf-mongo
  namespace: overleaf
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: overleaf-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: batch/v1
kind: Job
metadata:
  name: overleaf-mongo-init-replicaset
  namespace: overleaf
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z overleaf-mongo 27017; do echo waiting for mongo; sleep 2; done
      containers:
        - name: init-replicaset
          image: mongo:8.0
          command:
            - mongosh
            - --host
            - overleaf-mongo
            - --eval
            - >
              const HOST = "overleaf-mongo-0.overleaf-mongo.overleaf.svc.cluster.local:27017";
              let cfg = null;
              try { cfg = rs.conf(); } catch (e) { cfg = null; }
              if (cfg === null) {
                rs.initiate({_id: "overleaf", members: [{_id: 0, host: HOST}]});
                print("replica set initiated with " + HOST);
              } else {
                let primary = false;
                try { primary = rs.status().members[0].stateStr === "PRIMARY"; } catch (e) {}
                if (cfg.members[0].host !== HOST || !primary) {
                  cfg.members[0].host = HOST;
                  cfg.version += 1;
                  rs.reconfig(cfg, {force: true});
                  print("replica set reconfigured to " + HOST);
                } else {
                  print("replica set healthy on " + HOST + ", nothing to do");
                }
              }
