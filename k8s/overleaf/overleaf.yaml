---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overleaf-data
  namespace: overleaf
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf
  namespace: overleaf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overleaf
  template:
    metadata:
      labels:
        app: overleaf
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z overleaf-mongo 27017; do echo waiting for mongo; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z overleaf-redis 6379; do echo waiting for redis; sleep 2; done
      containers:
        - name: overleaf
          image: sharelatex/sharelatex:latest
          ports:
            - containerPort: 80
          env:
            - name: OVERLEAF_APP_NAME
              value: "Overleaf"
            - name: OVERLEAF_MONGO_URL
              value: "mongodb://overleaf-mongo/sharelatex"
            - name: OVERLEAF_REDIS_HOST
              value: "overleaf-redis"
            - name: OVERLEAF_REDIS_PORT
              value: "6379"
            - name: REDIS_HOST
              value: "overleaf-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: OVERLEAF_SITE_URL
              value: "https://overleaf.svc.johannesmoseler.de"
            - name: ENABLE_CONVERSIONS
              value: "true"
            - name: EMAIL_CONFIRMATION_DISABLED
              value: "true"
            - name: OVERLEAF_INVITE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: invite-token-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/overleaf
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health_check
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: overleaf-data
---
apiVersion: v1
kind: Service
metadata:
  name: overleaf
  namespace: overleaf
spec:
  selector:
    app: overleaf
  ports:
    - port: 80
      targetPort: 80
