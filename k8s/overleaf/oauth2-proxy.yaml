---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secrets
  namespace: overleaf
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-secrets
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: homelab/overleaf/oauth2-proxy
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: homelab/overleaf/oauth2-proxy
        property: cookie-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: overleaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:latest
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.svc.johannesmoseler.de/realms/homelab
            - --client-id=overleaf
            - --redirect-url=https://overleaf.svc.johannesmoseler.de/oauth2/callback
            # Forward-Auth-Modus: kein echter Reverse-Proxy zum Backend -
            # Traefik fragt nur /oauth2/auth, den echten (auch
            # WebSocket-)Traffic schickt Traefik direkt an Overleaf, nicht
            # durch oauth2-proxy durch.
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-domain=overleaf.svc.johannesmoseler.de
            - --whitelist-domain=overleaf.svc.johannesmoseler.de
            - --email-domain=*
            - --skip-provider-button=true
            - --set-xauthrequest=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: overleaf
spec:
  selector:
    app: oauth2-proxy
  ports:
    - port: 4180
      targetPort: 4180
