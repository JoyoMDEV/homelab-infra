apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://docs.renovatebot.com/helm-charts
    chart: renovate
    targetRevision: "46.275.2"
    helm:
      values: |
        cronjob:
          schedule: "0 6 * * *"
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3

        # existingSecret ist ein TOP-LEVEL Wert, NICHT unter renovate:
        # Das Secret wird als envFrom.secretRef in den Pod gemountet.
        # Key im Secret muss RENOVATE_TOKEN heißen.
        existingSecret: renovate-secret

        renovate:
          # RENOVATE_NODE_ARGS wird vom Startup-Script als Array gelesen:
          # /usr/local/sbin/renovate: "${RENOVATE_NODE_ARGS[@]}"
          # → als einzelner String-Wert übergeben, bash splittet ihn automatisch
          env:
            RENOVATE_NODE_ARGS: "--max-old-space-size=1536"

          config: |
            {
              "platform": "github",
              "repositories": ["JoyoMDEV/homelab-infra"],
              "autodiscover": false,
              "onboarding": false,
              "requireConfig": "optional"
            }

        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 2Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: automation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
