apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.3.0"
    helm:
      values: |
        # CRD Management (v2.x Syntax)
        crds:
          create: true

        replicaCount: 1

        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi

        # Prometheus Metriken für Grafana
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: monitoring

        # Webhook wird nicht benötigt (kein ValidatingWebhookConfiguration)
        webhook:
          replicaCount: 1
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi

        certController:
          replicaCount: 1
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
