---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overleaf
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JoyoMDEV/homelab-infra.git
    targetRevision: main
    path: k8s/overleaf
  destination:
    server: https://kubernetes.default.svc
    namespace: overleaf
  syncPolicy:
    automated:
      # Explicit, so root re-enables it if someone switches auto-sync off
      # live: automated.enabled=false had been set outside git, and the app
      # silently stopped syncing from 2026-09 to 2026-11 (root's three-way
      # merge leaves fields alone that git doesn't mention).
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true