apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0
    helm:
      values: |
        # ── Deployment Mode ───────────────────────────────────────────────────
        # SingleBinary: alle Loki-Komponenten in einem Pod – ideal für Homelabs
        # (loki-stack war dasselbe Prinzip, aber deprecated seit 2024)
        deploymentMode: SingleBinary

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 20Gi
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi
          # k3s-server is the control-plane node (embedded etcd + apiserver) and
          # stays chronically memory-starved when app workloads share it - keep
          # Loki off it.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - k3s-server

        # k3s-server ist der Control-Plane-Node (siehe singleBinary oben) - auch
        # die Cache-/Gateway-/Canary-Komponenten sollen dort nicht laufen.
        # chunksCache/resultsCache liefen zuvor mit mehreren GB RSS auf
        # k3s-server und waren der größte Speicherverbraucher im Cluster.
        chunksCache:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - k3s-server
        resultsCache:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - k3s-server
        gateway:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - k3s-server
        lokiCanary:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - k3s-server

        # Alle anderen Modi auf 0 setzen (verhindert ungewollte Deployments)
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0

        # ── Loki Konfiguration ────────────────────────────────────────────────
        loki:
          auth_enabled: false   # Single-tenant, kein Multi-Tenant nötig

          commonConfig:
            replication_factor: 1

          # TSDB + filesystem – moderner Ersatz für den deprecated boltdb-shipper
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: filesystem

          limits_config:
            reject_old_samples: true
            reject_old_samples_max_age: 168h   # 7 Tage
            retention_period: 720h             # 30 Tage
            allow_structured_metadata: true

          compactor:
            retention_enabled: true
            delete_request_store: filesystem

        # ── Prometheus-Integration ────────────────────────────────────────────
        monitoring:
          serviceMonitor:
            enabled: true      # Prometheus scrapt Loki-Metriken automatisch
            labels:
              release: kube-prometheus-stack

          # Self-monitoring via Loki selbst schreiben – optional
          selfMonitoring:
            enabled: false

          # Lokis eigene Rules (Recording + Alerting) für Prometheus
          rules:
            enabled: true

        # ── Alloy ──────────────────────────────────────────────────────────────
        # HINWEIS: Der grafana/loki-Chart hat KEINE Alloy-Subchart-Dependency -
        # ein "alloy:"-Block hier wäre ein von Helm stillschweigend ignorierter,
        # toter Key (kein Fehler, einfach keine Wirkung). Alloy läuft deshalb
        # als eigene ArgoCD-Application, siehe
        # k8s/argocd/applications/alloy.yaml.

        # Kein MinIO – wir nutzen filesystem (PVC)
        minio:
          enabled: false

        # Grafana kommt von kube-prometheus-stack, nicht von hier
        grafana:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
