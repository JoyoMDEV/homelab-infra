apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0
    helm:
      values: |
        # ── Deployment Mode ───────────────────────────────────────────────────
        # SingleBinary: alle Loki-Komponenten in einem Pod – ideal für Homelabs
        # (loki-stack war dasselbe Prinzip, aber deprecated seit 2024)
        deploymentMode: SingleBinary

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 20Gi
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi

        # Alle anderen Modi auf 0 setzen (verhindert ungewollte Deployments)
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0

        # ── Loki Konfiguration ────────────────────────────────────────────────
        loki:
          auth_enabled: false   # Single-tenant, kein Multi-Tenant nötig

          commonConfig:
            replication_factor: 1

          # TSDB + filesystem – moderner Ersatz für den deprecated boltdb-shipper
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: filesystem

          limits_config:
            reject_old_samples: true
            reject_old_samples_max_age: 168h   # 7 Tage
            retention_period: 720h             # 30 Tage
            allow_structured_metadata: true

          compactor:
            retention_enabled: true
            delete_request_store: filesystem

        # ── Prometheus-Integration ────────────────────────────────────────────
        monitoring:
          serviceMonitor:
            enabled: true      # Prometheus scrapt Loki-Metriken automatisch
            labels:
              release: kube-prometheus-stack

          # Self-monitoring via Loki selbst schreiben – optional
          selfMonitoring:
            enabled: false

          # Lokis eigene Rules (Recording + Alerting) für Prometheus
          rules:
            enabled: true

        # ── Alloy (Nachfolger von Promtail) ───────────────────────────────────
        # Sammelt Pod-Logs von allen Nodes und schickt sie an Loki.
        # Promtail ist seit März 2026 EOL – Alloy ist der offizielle Nachfolger.
        alloy:
          enabled: true

          # Hubble-Flow-Export-Datei pro Node zusätzlich in den Alloy-Container
          # mounten (schreibt cilium-agent via hubble.export.static, siehe
          # ansible/files/cilium-values.yaml). Ohne diesen hostPath-Mount sieht
          # Alloy nur Pod-Logs über die Kubernetes-API, nicht diese Host-Datei.
          volumes:
            extra:
              - name: hubble-flowlogs
                hostPath:
                  path: /var/run/cilium/hubble
          mounts:
            extra:
              - name: hubble-flowlogs
                mountPath: /var/run/cilium/hubble
                readOnly: true

          # HOSTNAME im Container ist der Pod-Name, nicht der Node-Name -
          # für ein brauchbares "node"-Label im Hubble-Flow-Log-Stream
          # brauchen wir den echten Node-Namen über die Downward API.
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          alloy:
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 128Mi

            # Alloy-Konfiguration: Kubernetes Pod-Logs → Loki
            # Entspricht der alten Promtail-Konfiguration, aber in River-Syntax
            extraConfig: |
              // Kubernetes Pod-Logs entdecken
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Labels umschreiben: Kubernetes-Metadaten → Loki-Labels
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
              }

              // Logs lesen und an Loki senden
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }

              // Hubble-Flow-Logs (Cilium) von der Host-Datei einlesen -
              // Grundlage für die 14-Tage-CiliumNetworkPolicy-Analyse.
              // job="hubble-flows" als eigenes Loki-Label zum späteren Filtern
              // in Grafana/LogQL, z.B. {job="hubble-flows", node="k3s-server"}.
              local.file_match "hubble_flows" {
                path_targets = [{
                  __path__ = "/var/run/cilium/hubble/events.log",
                  job      = "hubble-flows",
                  node     = env("NODE_NAME"),
                }]
              }

              loki.source.file "hubble_flows" {
                targets    = local.file_match.hubble_flows.targets
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

        # Kein MinIO – wir nutzen filesystem (PVC)
        minio:
          enabled: false

        # Grafana kommt von kube-prometheus-stack, nicht von hier
        grafana:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
