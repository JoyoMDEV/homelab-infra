---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://nextcloud.github.io/helm
    chart: nextcloud
    # Chart 6.x hatte einen Bug: configs: + extraVolumeMounts erzeugten doppelte
    # mountPaths → "must be unique" Fehler. Chart 8.x behebt das.
    targetRevision: "8.9.1"
    helm:
      values: |
        image:
          flavor: fpm-alpine

        nextcloud:
          host: nextcloud.homelab.local
          username: admin
          password: "" # gesetzt via existingSecret

          existingSecret:
            enabled: true
            secretName: nextcloud-secret
            usernameKey: nextcloud-username
            passwordKey: nextcloud-password

          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -e

                    # PHP-FPM braucht einen Moment zum Starten
                    sleep 10

                    # ── 1. Installation falls nötig ───────────────────────────
                    STATUS=$(su -s /bin/sh www-data -c \
                      "php /var/www/html/occ status --output=json 2>/dev/null" \
                      | grep -o '"installed":true' || true)

                    if [ -z "$STATUS" ]; then
                      echo "==> Installiere Nextcloud..."

                      if [ -f /var/www/html/config/config.php ]; then
                        SIZE=$(stat -c%s /var/www/html/config/config.php)
                        if [ "$SIZE" -le 6 ]; then
                          rm -f /var/www/html/config/config.php
                        fi
                      fi

                      su -s /bin/sh www-data -c "
                        php /var/www/html/occ maintenance:install \
                          --database=pgsql \
                          --database-host=${POSTGRES_HOST} \
                          --database-name=${POSTGRES_DB} \
                          --database-user=${POSTGRES_USER} \
                          --database-pass=${POSTGRES_PASSWORD} \
                          --admin-user=${NEXTCLOUD_ADMIN_USER} \
                          --admin-pass=${NEXTCLOUD_ADMIN_PASSWORD} \
                          --data-dir=/var/www/html/data \
                          2>&1
                      "
                      echo "==> Installation abgeschlossen."
                    else
                      echo "==> Nextcloud bereits installiert, überspringe Installation."
                    fi

                    # ── 2. trusted_domain sicherstellen ──────────────────────
                    su -s /bin/sh www-data -c "
                      php /var/www/html/occ config:system:set \
                        trusted_domains 0 \
                        --value=nextcloud.homelab.local 2>/dev/null
                    " || true

                    # ── 3. Apps aktivieren ────────────────────────────────────
                    echo "==> Aktiviere Apps..."

                    activate_app() {
                      APP=$1
                      if ! su -s /bin/sh www-data -c \
                          "php /var/www/html/occ app:list --enabled 2>/dev/null" \
                          | grep -q "^  - ${APP}:"; then
                        su -s /bin/sh www-data -c \
                          "php /var/www/html/occ app:install ${APP} 2>/dev/null || \
                           php /var/www/html/occ app:enable ${APP} 2>/dev/null" || true
                        echo "    ${APP} aktiviert."
                      else
                        echo "    ${APP} bereits aktiv."
                      fi
                    }

                    activate_app oidc_login
                    activate_app files_external
                    activate_app mail
                    activate_app calendar
                    activate_app contacts
                    activate_app notes
                    activate_app deck

                    echo "==> postStart abgeschlossen."

          extraEnv:
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: redis-password
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: oidc-client-secret

          phpConfigs:
            www.conf: |
              [www]
              user = www-data
              group = www-data
              listen = 127.0.0.1:9000
              pm = dynamic
              pm.max_children = 20
              pm.start_servers = 5
              pm.min_spare_servers = 3
              pm.max_spare_servers = 10
              pm.max_requests = 500
              clear_env = no

          defaultConfigs:
            redis.config.php: false

          configs:
            redis.config.php: |-
              <?php
              $CONFIG = array(
                'memcache.local' => '\OC\Memcache\Redis',
                'memcache.distributed' => '\OC\Memcache\Redis',
                'memcache.locking' => '\OC\Memcache\Redis',
                'redis' => array(
                  'host' => 'redis-master.infrastructure.svc.cluster.local',
                  'port' => 6379,
                  'password' => getenv('REDIS_HOST_PASSWORD'),
                ),
              );

            proxy.config.php: |-
              <?php
              $CONFIG = array(
                'trusted_proxies' => ['10.0.0.0/8'],
                'overwriteprotocol' => 'https',
                'overwrite.cli.url' => 'https://nextcloud.homelab.local',
                'forwarded_for_headers' => ['HTTP_X_FORWARDED_FOR'],
              );

            misc.config.php: |-
              <?php
              $CONFIG = array(
                'default_phone_region' => 'DE',
                'maintenance_window_start' => 2,
                'loglevel' => 1,
              );

            oidc.config.php: |-
              <?php
              $CONFIG = array(
                'oidc_login_provider_url'          => 'https://auth.homelab.local/realms/homelab',
                'oidc_login_client_id'             => 'nextcloud',
                'oidc_login_client_secret'         => getenv('OIDC_CLIENT_SECRET'),
                'oidc_login_auto_redirect'         => false,
                'oidc_login_hide_password_form'    => false,
                'oidc_login_disable_registration'  => false,
                'oidc_login_attributes'            => array(
                  'id'     => 'preferred_username',
                  'name'   => 'name',
                  'mail'   => 'email',
                  'groups' => 'groups',
                ),
                'oidc_login_create_user'           => true,
                'oidc_login_default_quota'         => '',
                'oidc_login_use_id_token'          => false,
                'oidc_login_tls_verify'            => true,
                'oidc_login_scope'                 => 'openid profile email',
                'oidc_login_code_challenge_method' => 'S256',
                'oidc_login_logout_url'            => 'https://auth.homelab.local/realms/homelab/protocol/openid-connect/logout',
                'oidc_login_button_text'           => 'Mit Keycloak anmelden',
              );

          # CA-Lösung:
          # - combined-ca.crt = Standard-CA-Bundle + homelab CA (als ConfigMap)
          # - php.ini setzt openssl.cafile auf combined-ca.crt
          # - PHP vertraut damit sowohl öffentlichen CAs (Hetzner, etc.) als auch homelab CA
          extraVolumes:
            - name: homelab-ca
              secret:
                secretName: homelab-ca
            - name: php-ca-ini
              configMap:
                name: nextcloud-php-ca
            - name: combined-ca
              configMap:
                name: nextcloud-combined-ca

          extraVolumeMounts:
            - name: homelab-ca
              mountPath: /etc/ssl/certs/homelab-ca.pem
              subPath: homelab-ca.crt
              readOnly: true
            - name: php-ca-ini
              mountPath: /usr/local/etc/php/conf.d/zz-homelab-ca.ini
              subPath: zz-homelab-ca.ini
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/certs/combined-ca.crt
              subPath: combined-ca.crt
              readOnly: true

        internalDatabase:
          enabled: false

        externalDatabase:
          enabled: true
          type: postgresql
          host: homelab-pg-rw.infrastructure.svc.cluster.local
          port: 5432
          database: nextcloud
          user: nextcloud
          existingSecret:
            enabled: true
            secretName: nextcloud-secret
            usernameKey: db-username
            passwordKey: db-password
          sslMode: disable

        redis:
          enabled: false

        nginx:
          enabled: true

        persistence:
          enabled: true
          size: 10Gi

        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi

        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: productivity-nextcloud-headers@kubernetescrd
          hosts:
            - host: nextcloud.homelab.local
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: homelab-wildcard-tls
              hosts:
                - nextcloud.homelab.local

        cronjob:
          enabled: true

        startupProbe:
          enabled: true
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60

        livenessProbe:
          enabled: true
          initialDelaySeconds: 30

        readinessProbe:
          enabled: true
          initialDelaySeconds: 30

        initContainers:
          - name: setup-nextcloud-apps
            image: nextcloud:fpm-alpine
            command:
              - sh
              - -c
              - |
                echo "==> initContainer: bereit."
            volumeMounts:
              - name: nextcloud-main
                mountPath: /var/www/html
              - name: homelab-ca
                mountPath: /etc/ssl/certs/homelab-ca.pem
                subPath: homelab-ca.crt
                readOnly: true

  destination:
    server: https://kubernetes.default.svc
    namespace: productivity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
