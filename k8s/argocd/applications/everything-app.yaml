apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: everything-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JoyoMDEV/homelab-infra.git
    targetRevision: main
    path: k8s/charts/everything-app
  destination:
    server: https://kubernetes.default.svc
    namespace: everything-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
