apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: "25.5.3"
    helm:
      values: |
        architecture: standalone

        auth:
          enabled: true
          existingSecret: redis-secret
          existingSecretPasswordKey: redis-password

        master:
          persistence:
            enabled: true
            size: 2Gi
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi

        replica:
          replicaCount: 0

        # No maxmemory was configured before this change, which left
        # redis_memory_max_bytes at 0 - every used/max ratio (dashboard
        # panel, RedisMemoryHigh alert) evaluated to Infinity, and the
        # alert was permanently (falsely) firing as a result. Bounded to
        # comfortably under the 256Mi container limit, leaving headroom
        # for the redis process itself.
        commonConfiguration: |-
          appendonly yes
          save ""
          maxmemory 200mb
          maxmemory-policy allkeys-lru

  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
