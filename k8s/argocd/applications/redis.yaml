apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: "25.3.2"
    helm:
      values: |
        architecture: standalone

        auth:
          enabled: true
          existingSecret: redis-secret
          existingSecretPasswordKey: redis-password

        master:
          persistence:
            enabled: true
            size: 2Gi
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi

        replica:
          replicaCount: 0

        # Prometheus metrics via the bundled redis_exporter sidecar - was
        # off before, meaning no redis_* series existed for alerting/
        # dashboards (only generic kube-state-metrics pod health).
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
