apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.min.io
    chart: minio
    targetRevision: "5.4.0"
    helm:
      values: |
        # MinIO läuft als Single-Node – für Homelab ausreichend
        mode: standalone

        # Credentials kommen aus dem Secret
        existingSecret: minio-secret

        # Persistenz auf einem PVC – MinIO selbst cached nur,
        # echter Storage ist die Storage Box via WebDAV-PVC
        persistence:
          enabled: true
          size: 10Gi

        # Buckets werden beim Start automatisch angelegt
        buckets:
          - name: cnpg-backups
            policy: none
            purge: false
          - name: velero-backups
            policy: none
            purge: false

        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi

        # S3 API über Traefik erreichbar (Tailscale DNS: *.homelab.local läuft
        # als Wildcard über die Samba AD DC, daher reicht der Ingress hier aus –
        # kein zusätzlicher DNS-Eintrag nötig)
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - minio.homelab.local
          tls:
            - secretName: homelab-wildcard-tls
              hosts:
                - minio.homelab.local

        # Web-Console separat, eigener Ingress-Block im Chart
        consoleIngress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - minio-console.homelab.local
          tls:
            - secretName: homelab-wildcard-tls
              hosts:
                - minio-console.homelab.local

        # Damit die Console-Redirects (Login etc.) auf den richtigen Hostnamen zeigen.
        # WICHTIG: MINIO_SERVER_URL absichtlich NICHT gesetzt – der Pod selbst
        # kann minio.homelab.local nicht auflösen (CoreDNS kennt nur *.svc.cluster.local,
        # der Hostname existiert nur über Tailscale Split DNS). Würde man das setzen,
        # versucht die Console beim Login sich selbst über diese URL zu erreichen
        # und scheitert an DNS -> 503 "network error" im Browser.
        environment:
          MINIO_BROWSER_REDIRECT_URL: "https://minio-console.homelab.local"

        # Metrics für Prometheus
        metrics:
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # Namespace existiert bereits
