apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homarr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://homarr-labs.github.io/charts
    chart: homarr
    targetRevision: 1.*
    helm:
      values: |
        image:
          tag: latest

        env:
          AUTH_PROVIDER: "oidc"
          AUTH_OIDC_ISSUER: "https://auth.homelab.local/realms/homelab"
          AUTH_OIDC_CLIENT_ID: "homarr"
          AUTH_OIDC_CLIENT_NAME: "Keycloak"
          AUTH_OIDC_ADMIN_GROUP: "argocd-admins"
          AUTH_OIDC_OWNER_GROUP: "argocd-admins"
          AUTH_OIDC_AUTO_LOGIN: "true"

        envFrom:
          - secretRef:
              name: homarr-secret

        persistence:
          data:
            enabled: true
            size: 1Gi

        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - host: homarr.homelab.local
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: homelab-wildcard-tls
              hosts:
                - homarr.homelab.local

        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
