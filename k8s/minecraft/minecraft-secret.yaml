---
# RCON-Passwort aus Vault - vorher einmalig anlegen, z.B.:
#   vault kv put secret/homelab/minecraft/rcon RCON_PASSWORD=<zufälliges-passwort>
# RCON ist NICHT über die IngressRouteTCP nach außen geroutet (nur Port 25565
# ist über den Traefik-Entrypoint erreichbar) - Passwort ist trotzdem nötig,
# damit RCON nicht mit einem leeren/Default-Passwort im Cluster-Netz offen ist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-secret
  namespace: minecraft
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: minecraft-secret
    creationPolicy: Owner
  data:
    - secretKey: RCON_PASSWORD
      remoteRef:
        key: homelab/minecraft/rcon
        property: RCON_PASSWORD
