---
# RCON-Passwort + rcon-web-admin-Login aus Vault - siehe
# scripts/setup-minecraft-rcon.sh für die rcon-web-admin-Werte (RCON_PASSWORD
# einmalig manuell angelegt, z.B.:
#   vault kv put secret/homelab/minecraft/rcon RCON_PASSWORD=<zufälliges-passwort>
# ).
# RCON selbst ist NICHT über die IngressRouteTCP nach außen geroutet (nur Port
# 25565 ist über den Traefik-Entrypoint erreichbar) - Passwort ist trotzdem
# nötig, damit RCON nicht mit einem leeren/Default-Passwort im Cluster-Netz
# offen ist. rcon-web-admin (Sidecar im StatefulSet) nutzt RCON_PASSWORD
# ebenfalls, um sich intern über localhost mit RCON zu verbinden.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-secret
  namespace: minecraft
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: minecraft-secret
    creationPolicy: Owner
  data:
    - secretKey: RCON_PASSWORD
      remoteRef:
        key: homelab/minecraft/rcon
        property: RCON_PASSWORD
    - secretKey: RWA_USERNAME
      remoteRef:
        key: homelab/minecraft/rcon
        property: RWA_USERNAME
    - secretKey: RWA_PASSWORD
      remoteRef:
        key: homelab/minecraft/rcon
        property: RWA_PASSWORD
