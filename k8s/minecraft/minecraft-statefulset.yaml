---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  namespace: minecraft
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
        # Damit Backstages Kubernetes-Plugin (siehe catalog/minecraft/catalog-info.yaml)
        # diesen Pod dem Component zuordnen kann - selbes Muster wie
        # k8s/charts/backstage/templates/deployment.yaml.
        backstage.io/kubernetes-id: minecraft
    spec:
      # Fest auf den k3s-server gepinnt - analog zur traefik-public-Instanz
      # (siehe deren Kommentar zum CX53-Node). Noetig, weil die minecraft-data
      # PVC ueber "local-path" (hostPath-basiert) laeuft: das zugehoerige PV
      # bekommt eine nodeAffinity auf den Node, auf dem es zuerst provisioniert
      # wurde - der Pod MUSS also immer auf demselben Node landen, sonst
      # scheitert das Scheduling oder es wird faelschlich ein neues, leeres
      # Volume auf einem anderen Node angelegt.
      nodeSelector:
        kubernetes.io/hostname: k3s-server
      # itzg-Image läuft nicht als root, wenn UID/GID vorgegeben werden -
      # 1000:1000 ist der im Image dokumentierte Standard-User.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java17
          ports:
            - containerPort: 25565
              name: minecraft
            - containerPort: 25575
              name: rcon
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false # Server schreibt laufend ins /data-Volume
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "FORGE"
            - name: VERSION
              value: "1.20.1"
            - name: FORGE_VERSION
              value: "47.4.10" # muss exakt zur Client-Modpack-Version passen
            - name: MEMORY
              value: "6G"
            - name: MODRINTH_PROJECTS
              value: "@/extras/modrinth-mods.txt"
            - name: MODRINTH_DOWNLOAD_DEPENDENCIES
              value: "required"
            - name: DIFFICULTY
              value: "normal"
            - name: MOTD
              value: "Vanilla+ Server \u00a7a[Mining/Automation/Magic] \n Neue Modpack Version seit: 31.08"
            - name: MAX_PLAYERS
              value: "10"
            # Verifiziert Spieler-Accounts gegen Mojang - bewusst NICHT auf
            # false stellen, sonst kann sich jeder unter jedem Namen
            # verbinden (Voraussetzung, damit WHITELIST unten überhaupt
            # etwas taugt).
            - name: ONLINE_MODE
              value: "true"
            # TODO: echte Minecraft-Namen der Whitelist eintragen, bevor der
            # Server ans Netz geht - so wie hier steht, kann NIEMAND joinen.
            - name: WHITELIST
              value: "Leander_02,Sternenkxnd,Nilo224,Joyyyo"
            - name: OPS
              value: "Joyyyo"
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ENFORCE_WHITELIST
              value: "true"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secret
                  key: RCON_PASSWORD
            # Applied Botanics Addon (AE2 x Botania) ist bei 1.20.1 die
            # STABILE Version (war bei 1.21.1 nur Alpha) - kann jetzt
            # regulär mit rein, falls nicht schon auf Modrinth verfügbar
            # per Slug oben in der ConfigMap. Falls nur auf CurseForge:
            # - name: CF_SLUG
            #   value: |
            #     applied-botanics-addon
          volumeMounts:
            - name: data
              mountPath: /data
            - name: modlist
              mountPath: /extras
          resources:
            requests:
              cpu: "2"
              memory: "7Gi"
            limits:
              cpu: "5"
              memory: "10Gi"
          readinessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 25565
            initialDelaySeconds: 120
            periodSeconds: 30
        # rcon-web-admin: browser console for the RCON port above, so admin
        # commands (whitelist/op/kick/gamerule/...) don't need a local
        # rcon-cli/SSH session. Runs as a true sidecar (same pod) so it talks
        # to RCON over localhost - that traffic never crosses a pod boundary,
        # so it's not subject to (and doesn't need a rule in) the
        # CiliumNetworkPolicy in k8s/security/network-policies/, keeping port
        # 25575 itself never reachable from anywhere else. Only its own web
        # port (4326) is opened up, via k8s/minecraft/minecraft-rcon-ingress.yaml.
        # Erbt den runAsUser/runAsGroup 1000 vom Pod-securityContext oben
        # (gilt fuer alle Container im Pod, kein eigener Override hier) -
        # ob itzg/rcon unter dieser UID sauber startet, ist NICHT verifiziert
        # (anders als beim minecraft-Container, dessen 1000:1000-Standard im
        # Image dokumentiert ist). Nach dem ersten Sync prüfen:
        #   kubectl get pods -n minecraft
        # Falls CrashLoopBackOff/Permission denied: hier einen eigenen
        # securityContext mit passender runAsUser setzen.
        - name: rcon-web-admin
          image: itzg/rcon
          ports:
            - containerPort: 4326
              name: rcon-web
            - containerPort: 4327
              name: rcon-ws
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: RWA_RCON_HOST
              value: "localhost"
            - name: RWA_RCON_PORT
              value: "25575"
            - name: RWA_RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secret
                  key: RCON_PASSWORD
            - name: RWA_ADMIN
              value: "TRUE"
            - name: RWA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: minecraft-secret
                  key: RWA_USERNAME
            - name: RWA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-secret
                  key: RWA_PASSWORD
            # Best-effort browser-side fix so the websocket (live console
            # output) tries to connect back over the same HTTPS origin
            # instead of a bare :4327 the Ingress doesn't route. NOT
            # confirmed to fully work server-side for this project (see
            # comment in minecraft-rcon-ingress.yaml) - verify after deploy.
            - name: RWA_WEBSOCKET_URL_SSL
              value: "wss://minecraft-rcon.homelab.local/"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: modlist
          configMap:
            name: minecraft-modlist
---
# ClusterIP reicht - Erreichbarkeit von außen läuft über den dedizierten
# TCP-Entrypoint der traefik-public-Instanz (siehe
# k8s/public/minecraft-ingressroute.yaml), nicht über einen eigenen
# LoadBalancer/NodePort. LoadBalancer würde in diesem Cluster ohnehin ewig
# "Pending" bleiben (kein servicelb, siehe Kommentar in traefik-public.yaml).
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    backstage.io/kubernetes-id: minecraft
spec:
  type: ClusterIP
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
    - name: rcon
      port: 25575
      targetPort: 25575
    - name: rcon-web
      port: 4326
      targetPort: 4326
    - name: rcon-ws
      port: 4327
      targetPort: 4327
