---
# Web-UI for the rcon-web-admin sidecar in the minecraft StatefulSet (see its
# comment) - full server administration via console commands, so this
# deliberately goes through the internal (k3s-built-in) Traefik under
# *.homelab.local, NOT the public traefik-public entrypoint used for the
# game port. rcon-web-admin has its own login (RWA_USERNAME/RWA_PASSWORD),
# so no extra BasicAuth middleware is layered on top.
#
# WebSocket port 4327 is NOT just "live console output" - rcon-web-admin's
# entire frontend (login included, see public/scripts/socket.js) runs over
# this one raw `ws` connection, opened standalone on config.port+1 and never
# attached to the Express HTTP server on 4326. Confirmed by reading the
# shipped source in the image (rcon-web-admin/rcon-web-admin#36 was
# inconclusive on this): a plain WS upgrade to this Ingress's "/" path lands
# on port 4326 and gets an ordinary 200 back (no 101), while the same
# handshake against svc/minecraft:4327 directly succeeds. Without a route to
# 4327, the browser's socket never opens and the UI loops on "Verbindung zum
# Backend geschlossen, erneuter Versuch in 5 Sekunden" forever.
#
# Fix: a second path on this same host+TLS Ingress, forwarded to the 4327
# service port - standard k8s Ingress supports per-path backends, and
# Traefik proxies the WS upgrade on it transparently. RWA_WEBSOCKET_URL_SSL
# on the sidecar must point at this exact path (see minecraft-statefulset.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minecraft-rcon
  namespace: minecraft
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - minecraft-rcon.homelab.local
      secretName: homelab-wildcard-tls
  rules:
    - host: minecraft-rcon.homelab.local
      http:
        paths:
          # More specific path first - the raw `ws` server doesn't care
          # about the path itself, it's only here to give Traefik something
          # to route on separately from the port-4326 static/HTTP path below.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: minecraft
                port:
                  number: 4327
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minecraft
                port:
                  number: 4326
