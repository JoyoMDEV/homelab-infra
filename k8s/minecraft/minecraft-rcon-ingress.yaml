---
# Web-UI for the rcon-web-admin sidecar in the minecraft StatefulSet (see its
# comment) - full server administration via console commands, so this
# deliberately goes through the internal (k3s-built-in) Traefik under
# *.homelab.local, NOT the public traefik-public entrypoint used for the
# game port. rcon-web-admin has its own login (RWA_USERNAME/RWA_PASSWORD),
# so no extra BasicAuth middleware is layered on top.
#
# WebSocket port 4327 is NOT just "live console output" - rcon-web-admin's
# entire frontend (login included, see public/scripts/socket.js) runs over
# this one raw `ws` connection, opened standalone on config.port+1 and never
# attached to the Express HTTP server on 4326. Confirmed by reading the
# shipped source in the image (rcon-web-admin/rcon-web-admin#36 was
# inconclusive on this): a plain WS upgrade to this Ingress's "/" path lands
# on port 4326 and gets an ordinary 200 back (no 101), while the same
# handshake against svc/minecraft:4327 directly succeeds. Without a route to
# 4327, the browser's socket never opens and the UI loops on "Verbindung zum
# Backend geschlossen, erneuter Versuch in 5 Sekunden" forever.
#
# Fix: a second path on this same host+TLS Ingress, forwarded to the 4327
# service port - standard k8s Ingress supports per-path backends, and
# Traefik proxies the WS upgrade on it transparently. RWA_WEBSOCKET_URL_SSL
# on the sidecar must point at this exact path (see minecraft-statefulset.yaml).
#
# Traefik's k8s Ingress provider matches "/ws" as a plain string prefix (not
# path-element-aware like the upstream k8s Ingress spec technically
# requires), so a Prefix "/ws" also swallows "/wsconfig" - the plain HTTP GET
# the frontend fires first (see rcon-web-admin's public/scripts/socket.js:
# `$.getJSON("wsconfig", ...)`, handled by its Express route in
# src/routes.js) to learn the actual websocket URL/port. That GET was
# misrouted to this raw `ws` server on 4327, which can't answer plain HTTP
# and returned "426 Upgrade Required" - so the frontend never got its config
# and the page stayed blank, even across pod restarts (this was a static
# routing bug, not a runtime RCON connection issue).
#
# Tried pathType: Exact on /ws to fix this directly - that broke the real
# websocket route instead (a genuine "/ws" request then landed on 4326 and
# got a 404 from Express, confirmed with curl --http1.1 + Upgrade headers
# through the internal Traefik service IP). This Traefik version doesn't
# route Exact the way the k8s Ingress spec describes, so don't use it here.
#
# Fix that actually works: give "/wsconfig" its own explicit, more specific
# path to 4326, listed first - Traefik assigns router priority by matcher
# length, so this wins over the "/ws" prefix below regardless of pathType.
# The "/ws" prefix rule then only ever sees the real "/ws" request the
# websocket itself opens, exactly as before this whole investigation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minecraft-rcon
  namespace: minecraft
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - minecraft-rcon.homelab.local
      secretName: homelab-wildcard-tls
  rules:
    - host: minecraft-rcon.homelab.local
      http:
        paths:
          # Most specific path first - carves the one Express route that
          # would otherwise be swallowed by the "/ws" prefix below out to
          # its real backend (4326).
          - path: /wsconfig
            pathType: Exact
            backend:
              service:
                name: minecraft
                port:
                  number: 4326
          # The raw `ws` server doesn't care about the path itself, it's
          # only here to give Traefik something to route on separately from
          # the port-4326 static/HTTP path below.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: minecraft
                port:
                  number: 4327
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minecraft
                port:
                  number: 4326
