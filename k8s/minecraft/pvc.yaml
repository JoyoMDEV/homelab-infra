---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Quarry-/Mining-Dimension-Nutzung generiert viele Chunks - bei Bedarf
      # anpassen, lässt sich später vergrößern (je nach StorageClass).
      storage: 20Gi
