---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      imagePullSecrets:
        - name: backstage-registry-pull
      containers:
        - name: backstage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/homelab/homelab-ca.crt
            - name: POSTGRES_HOST
              value: homelab-pg-rw.infrastructure.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: db-password
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: auth-session-secret
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-secret
                  key: oidc-client-secret
          ports:
            - name: http
              containerPort: 7007
          volumeMounts:
            - name: homelab-ca
              mountPath: /etc/ssl/homelab
              readOnly: true
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
      volumes:
        - name: homelab-ca
          secret:
            secretName: homelab-ca
