---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: powersync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: powersync
  template:
    metadata:
      labels:
        app: powersync
    spec:
      containers:
        - name: powersync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `args`, not `command` - Kubernetes' `command` replaces the
          # image's own ENTRYPOINT entirely (unlike Docker Compose's
          # `command:`, which only overrides CMD and leaves ENTRYPOINT
          # running). Setting this as `command` made the container try to
          # exec a literal binary named "start", which doesn't exist -
          # confirmed live: "exec: \"start\": executable file not found in
          # $PATH", CrashLoopBackOff/StartError, exit code 128.
          args: ["start", "-r", "unified"]
          env:
            - name: POWERSYNC_CONFIG_PATH
              value: /config/service.yaml
            - name: PS_PORT
              value: {{ .Values.port | quote }}
            - name: NODE_OPTIONS
              # ~80% of the container's memory limit, per PowerSync's own
              # guidance.
              value: "--max-old-space-size=400"
          envFrom:
            - secretRef:
                name: powersync-secret
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          volumeMounts:
            - name: config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /probes/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
