apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: forgejo
spec:
  replicas: 1
  # RWO volume + SQLite: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      # System CA bundle + homelab CA, mounted over the image's bundle so git
      # and Go trust *.homelab.local (GitLab import, webhooks, mirrors)
      # without losing the public CAs.
      initContainers:
        - name: ca-bundle
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              cat /etc/ssl/certs/ca-certificates.crt > /ca-bundle/ca-certificates.crt
              if [ -f /homelab-ca/homelab-ca.crt ]; then
                cat /homelab-ca/homelab-ca.crt >> /ca-bundle/ca-certificates.crt
              fi
          volumeMounts:
            - name: ca-bundle
              mountPath: /ca-bundle
            - name: homelab-ca
              mountPath: /homelab-ca
              readOnly: true
      containers:
        - name: forgejo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          env:
            - name: FORGEJO__server__DOMAIN
              value: {{ .Values.hostname | quote }}
            - name: FORGEJO__server__ROOT_URL
              value: "https://{{ .Values.hostname }}/"
            - name: FORGEJO__server__SSH_DOMAIN
              value: {{ .Values.hostname | quote }}
            - name: FORGEJO__server__SSH_PORT
              value: {{ .Values.sshPublicPort | quote }}
            - name: FORGEJO__server__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"
            - name: FORGEJO__database__DB_TYPE
              value: sqlite3
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__actions__ENABLED
              value: "true"
            {{- with .Values.migrations }}
            - name: FORGEJO__migrations__ALLOW_LOCALNETWORKS
              value: {{ .allowLocalNetworks | quote }}
            {{- if .allowedDomains }}
            - name: FORGEJO__migrations__ALLOWED_DOMAINS
              value: {{ .allowedDomains | quote }}
            {{- end }}
            {{- end }}
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: secret-key
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: internal-token
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: data
              mountPath: /etc/gitea
              subPath: config
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: ca-bundle
          emptyDir: {}
        # Synced into namespaces labelled homelab.local/inject-ca=true by the
        # cert-sync CronJob.
        - name: homelab-ca
          secret:
            secretName: homelab-ca
            optional: true
