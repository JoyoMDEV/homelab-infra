---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      initContainers:
        - name: install-ca
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              mkdir -p /etc/gitlab/trusted-certs
              cp /ca-certs/homelab-ca.crt /etc/gitlab/trusted-certs/homelab-ca.crt
              echo "CA cert installed to /etc/gitlab/trusted-certs/"
              ls -la /etc/gitlab/trusted-certs/
          volumeMounts:
            - name: homelab-ca
              mountPath: /ca-certs
              readOnly: true
            - name: config
              mountPath: /etc/gitlab
      containers:
        - name: gitlab
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'https://{{ .Values.hostname }}'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                nginx['server_name'] = '_'
                nginx['proxy_set_headers'] = {
                  "X-Forwarded-Proto" => "https",
                  "X-Forwarded-Ssl" => "on"
                }
                postgresql['enable'] = false
                gitlab_rails['db_adapter'] = 'postgresql'
                gitlab_rails['db_encoding'] = 'unicode'
                gitlab_rails['db_host'] = 'homelab-pg-rw.infrastructure.svc.cluster.local'
                gitlab_rails['db_port'] = 5432
                gitlab_rails['db_username'] = 'gitlab'
                gitlab_rails['db_password'] = ENV['DB_PASSWORD']
                gitlab_rails['db_database'] = 'gitlab'
                redis['enable'] = false
                gitlab_rails['redis_host'] = 'redis-master.infrastructure.svc.cluster.local'
                gitlab_rails['redis_port'] = 6379
                gitlab_rails['redis_password'] = ENV['REDIS_PASSWORD']
                registry_external_url 'https://registry.homelab.local'
                registry['enable'] = true
                registry_nginx['listen_port'] = 5050
                registry_nginx['listen_https'] = false
                # nginx's compiled-in default client_body_timeout is 60s - too
                # short for a large image layer push over this cluster's
                # registry link (CloudCLI's node_modules layer, ~870MB,
                # consistently got cut at ~60s with "connection reset by peer"
                # on both the runner and registry sides, regardless of blob
                # size or bytes already transferred - a classic nginx-default-
                # timeout signature, not a bandwidth ceiling).
                #
                # registry_nginx['client_body_timeout']/['proxy_read_timeout']
                # etc are NOT real Omnibus attributes for this vhost - checked
                # against the actual upstream template
                # (files/gitlab-cookbooks/registry/templates/default/
                # nginx-gitlab-registry.conf.erb): proxy_read_timeout is
                # hardcoded to 900 in the template itself (not a variable),
                # and client_body_timeout isn't templated at all, so setting
                # either as a plain registry_nginx[...] key is silently a
                # no-op (confirmed live: the value never appeared in the
                # rendered nginx config, first attempt at this fix). The only
                # real hook into this vhost's server block is
                # @custom_gitlab_server_config, rendered verbatim at the end
                # of the block - raised generously (1800s) given the slow
                # observed throughput (~0.7MB/s => an 870MB layer alone needs
                # ~20 minutes).
                registry_nginx['custom_gitlab_server_config'] = "client_body_timeout 1800;\nsend_timeout 1800;"
                # TLS terminates at Traefik (see k8s/traefik-tlsstore.yaml), never here.
                # pages_nginx['listen_https'] MUST stay false: setting it true makes
                # nginx try to load an auto-generated Pages TLS vhost cert that
                # doesn't exist, which aborts nginx startup entirely and takes down
                # the whole GitLab app + registry, not just Pages (this happened once
                # already during context-hub's rollout - see commit a8a491d and
                # docs/superpowers/specs/2026-09-13-context-hub-design.md).
                # gitlab_pages['listen_proxy'] is pinned to localhost:8091 (not
                # Omnibus's own default of localhost:8090) because 8090 is also
                # pages_nginx['listen_port'] below, the externally-reachable Pages
                # port — leaving listen_proxy at its default collides with it.
                gitlab_pages['enable'] = true
                gitlab_pages['listen_proxy'] = 'localhost:8091'
                pages_nginx['enable'] = true
                pages_nginx['listen_port'] = 8090
                pages_nginx['listen_https'] = false
                pages_external_url 'https://{{ .Values.pagesHostname }}/'
                prometheus_monitoring['enable'] = false
                puma['worker_processes'] = 2
                sidekiq['max_concurrency'] = 10
                gitlab_rails['secret_key_base'] = ENV['GITLAB_SECRET_KEY_BASE']
                gitlab_rails['db_key_base'] = ENV['GITLAB_DB_KEY_BASE']
                gitlab_rails['otp_key_base'] = ENV['GITLAB_OTP_KEY_BASE']
                gitlab_rails['ci_job_token_signing_key'] = File.read('/etc/gitlab/ci_job_token_signing_key.pem') rescue nil
                gitlab_rails['gitlab_shell_ssh_port'] = 2222
                {{- if .Values.oidc.enabled }}
                gitlab_rails['omniauth_enabled'] = true
                gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
                gitlab_rails['omniauth_block_auto_created_users'] = false
                gitlab_rails['omniauth_auto_link_ldap_user'] = true
                gitlab_rails['omniauth_providers'] = [{ name: 'openid_connect', label: 'Keycloak', args: { name: 'openid_connect', scope: ['openid', 'profile', 'email'], response_type: 'code', issuer: '{{ .Values.oidc.issuer }}', discovery: true, client_auth_method: 'query', uid_field: 'preferred_username', pkce: true, client_options: { identifier: '{{ .Values.oidc.clientId }}', secret: ENV['OIDC_CLIENT_SECRET'], redirect_uri: 'https://{{ .Values.hostname }}/users/auth/openid_connect/callback' } } }]
                {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-secret
                  key: db-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-secret
                  key: redis-password
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitlab-secret
                  key: oidc-client-secret
            - name: GITLAB_SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: gitlab-rails-secrets
                  key: secret_key_base
            - name: GITLAB_DB_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: gitlab-rails-secrets
                  key: db_key_base
            - name: GITLAB_OTP_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: gitlab-rails-secrets
                  key: otp_key_base
          ports:
            - name: http
              containerPort: 80
            # hostPort hier entfernt - funktioniert seit dem Wechsel zu
            # Cilium nicht mehr (kubeProxyReplacement: false -> Ciliums
            # hostPort-BPF-Datapath inaktiv). SSH-Traffic erreicht diesen
            # Container jetzt über den Service "ssh"-Port + die neue
            # IngressRouteTCP (siehe templates/service.yaml), geroutet über
            # Traefiks neuen "ssh"-Entrypoint auf Port 2222
            # (k8s/traefik-tls-config.yaml).
            - name: ssh
              containerPort: 22
            - name: registry
              containerPort: 5050
            - name: pages
              containerPort: 8090
          volumeMounts:
            - name: config
              mountPath: /etc/gitlab
            - name: data
              mountPath: /var/opt/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: ci-job-token-signing-key
              mountPath: /etc/gitlab/ci_job_token_signing_key.pem
              subPath: ci_job_token_signing_key

          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
          startupProbe:
            exec:
              command:
                - curl
                - -sf
                - http://127.0.0.1/-/liveness
            failureThreshold: 120
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - curl
                - -sf
                - http://127.0.0.1/-/liveness
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - curl
                - -sf
                - http://127.0.0.1/-/readiness
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-logs
        - name: homelab-ca
          secret:
            secretName: homelab-ca
        - name: ci-job-token-signing-key
          secret:
            secretName: gitlab-rails-secrets
            items:
              - key: ci_job_token_signing_key
                path: ci_job_token_signing_key
