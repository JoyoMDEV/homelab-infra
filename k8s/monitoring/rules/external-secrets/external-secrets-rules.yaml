# No existing external-secrets category folder (it manages secrets for
# every other category, doesn't have its own ExternalSecret) - this uses
# its own namespace as the category, same fallback as garage would need
# if it ever gets one. Metrics were already being scraped (three
# ServiceMonitors already existed) - verified live against this cluster.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-rules
  namespace: external-secrets
  labels:
    release: monitoring
spec:
  groups:
    - name: external-secrets.rules
      rules:
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: critical
            service: external-secrets
          annotations:
            summary: "ExternalSecret {{ $labels.name }} not Ready"
            description: "{{ $labels.name }} in namespace {{ $labels.exported_namespace }} has had condition Ready=False for 15 minutes - its Kubernetes Secret may be stale or the Vault sync is broken."

        - alert: ExternalSecretSyncErrorsIncreasing
          expr: increase(externalsecret_sync_calls_error[15m]) > 5
          for: 5m
          labels:
            severity: warning
            service: external-secrets
          annotations:
            summary: "ExternalSecret {{ $labels.name }} accumulating sync errors"
            description: "{{ $labels.name }} in namespace {{ $labels.exported_namespace }} had {{ $value }} sync errors in the last 15 minutes."

        - alert: ExternalSecretsOperatorPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="external-secrets"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
            service: external-secrets
          annotations:
            summary: "external-secrets pod restarting repeatedly"
            description: "{{ $labels.pod }} restarted {{ $value }} times in the last 15 minutes - Vault sync for every service stops while this is down."
