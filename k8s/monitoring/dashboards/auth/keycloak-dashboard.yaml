apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: keycloak-dashboard
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "monitoring-grafana"
  json: |
    {
      "title": "Keycloak (auth)",
      "uid": "keycloak-auth",
      "tags": ["homelab", "auth"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pod ready",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_pod_container_status_ready{namespace=\"auth\", container=\"keycloak\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Not ready", "color": "red" }, "1": { "text": "Ready", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "JVM heap usage %",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "100 * jvm_memory_used_bytes{namespace=\"auth\", area=\"heap\"} / jvm_memory_max_bytes{namespace=\"auth\", area=\"heap\"}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } }
        },
        {
          "id": 3,
          "title": "Pod restarts (15m increase)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"auth\", container=\"keycloak\"}[15m])", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "HTTP 5xx (15m increase)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(http_server_requests_seconds_count{namespace=\"auth\", outcome=\"SERVER_ERROR\"}[15m])", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [ { "value": null, "color": "green" }, { "value": 1, "color": "red" } ] } } }
        },
        {
          "id": 5,
          "title": "HTTP request rate by outcome",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (outcome) (rate(http_server_requests_seconds_count{namespace=\"auth\"}[5m]))", "refId": "A", "legendFormat": "{{outcome}}" }
          ]
        }
      ]
    }
