apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gitlab-runner-dashboard
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: monitoring-grafana
  json: |-
    {
      "title": "GitLab Runner (gitlab)",
      "uid": "gitlab-runner-gitlab",
      "tags": [
        "homelab",
        "gitlab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Pod ready",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "kube_pod_container_status_ready{namespace=\"gitlab\", container=\"gitlab-runner\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Not ready",
                      "color": "red"
                    },
                    "1": {
                      "text": "Ready",
                      "color": "green"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Pod restarts (15m increase)",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"gitlab\", container=\"gitlab-runner\"}[15m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "red"
                  }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Restarts over time",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"gitlab\", container=\"gitlab-runner\"}[15m])",
              "refId": "A",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
