apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-secrets-dashboard
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "monitoring-grafana"
  json: |
    {
      "title": "External Secrets",
      "uid": "external-secrets",
      "tags": ["homelab", "security"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Secrets not Ready",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(externalsecret_status_condition{condition=\"Ready\", status=\"False\"} == 1)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [ { "value": null, "color": "green" }, { "value": 1, "color": "red" } ] } } }
        },
        {
          "id": 2,
          "title": "Total managed ExternalSecrets",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(externalsecret_status_condition{condition=\"Ready\", status=\"True\"} == 1)", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Pod restarts (15m increase)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"external-secrets\"}[15m])", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Sync errors by secret (15m increase)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(externalsecret_sync_calls_error[15m]) > 0", "refId": "A", "legendFormat": "{{exported_namespace}}/{{name}}" }
          ]
        },
        {
          "id": 5,
          "title": "Not-Ready secrets over time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(externalsecret_status_condition{condition=\"Ready\", status=\"False\"} == 1)", "refId": "A", "legendFormat": "not ready" }
          ]
        }
      ]
    }
