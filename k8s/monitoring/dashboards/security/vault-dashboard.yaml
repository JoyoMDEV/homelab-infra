apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vault-dashboard
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "monitoring-grafana"
  json: |
    {
      "title": "Vault (security)",
      "uid": "vault-security",
      "tags": ["homelab", "security"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Sealed status",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "vault_core_unsealed{namespace=\"security\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Sealed", "color": "red" }, "1": { "text": "Unsealed", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Pod ready",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_pod_container_status_ready{namespace=\"security\", container=\"vault\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Not ready", "color": "red" }, "1": { "text": "Ready", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 3,
          "title": "PVC usage %",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "100 * (1 - (kubelet_volume_stats_available_bytes{namespace=\"security\", persistentvolumeclaim=\"data-vault-0\"} / kubelet_volume_stats_capacity_bytes{namespace=\"security\", persistentvolumeclaim=\"data-vault-0\"}))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } }
        },
        {
          "id": 4,
          "title": "Pod restarts (15m increase)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"security\", container=\"vault\"}[15m])", "refId": "A" }
          ]
        }
      ]
    }
