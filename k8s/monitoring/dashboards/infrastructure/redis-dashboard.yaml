apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: redis-dashboard
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "monitoring-grafana"
  json: |
    {
      "title": "Redis (infrastructure)",
      "uid": "redis-infra",
      "tags": ["homelab", "infrastructure"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pod ready",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_pod_container_status_ready{namespace=\"infrastructure\", container=\"redis\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Not ready", "color": "red" }, "1": { "text": "Ready", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "redis_up (exporter)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "redis_up{namespace=\"infrastructure\"}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 3,
          "title": "PVC usage %",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "100 * (1 - (kubelet_volume_stats_available_bytes{namespace=\"infrastructure\", persistentvolumeclaim=\"redis-data-redis-master-0\"} / kubelet_volume_stats_capacity_bytes{namespace=\"infrastructure\", persistentvolumeclaim=\"redis-data-redis-master-0\"}))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } }
        },
        {
          "id": 4,
          "title": "Memory used / max",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "(100 * redis_memory_used_bytes{namespace=\"infrastructure\"} / redis_memory_max_bytes{namespace=\"infrastructure\"}) and (redis_memory_max_bytes{namespace=\"infrastructure\"} > 0)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 } }
        },
        {
          "id": 5,
          "title": "Pod restarts (15m increase)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"infrastructure\", container=\"redis\"}[15m])", "refId": "A", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 6,
          "title": "Connected clients",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "redis_connected_clients{namespace=\"infrastructure\"}", "refId": "A", "legendFormat": "{{instance}}" }
          ]
        }
      ]
    }
