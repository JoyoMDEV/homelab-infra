---
# EINMALIGER TEST - vor Overleaf, um die Let's-Encrypt/Hetzner-DNS-01-Kette
# end-to-end zu prüfen. STAGING, nicht Prod (siehe letsencrypt-issuer.yaml).
#
# Danach NICHT einfach löschen, sondern das Certificate/die IngressRoute
# umbauen auf den Prod-Issuer, sobald der Staging-Test erfolgreich war -
# das Wildcard-Zertifikat brauchen wir für Overleaf & alles Weitere sowieso.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: svc-wildcard-staging
  namespace: public
spec:
  secretName: svc-wildcard-tls-staging
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - "*.svc.johannesmoseler.de"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-test
  namespace: public
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami-test
  template:
    metadata:
      labels:
        app: whoami-test
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-test
  namespace: public
spec:
  selector:
    app: whoami-test
  ports:
    - port: 80
      targetPort: 80
---
# ingressClassName gesetzt, auch wenn's das interne Traefik (unrestricted
# CRD-Provider, siehe Kommentar im Chat) nicht filtert - Absicht dokumentieren,
# Bereinigung der Provider-Scoping-Überlappung ist ein separater Punkt für
# später, kein Sicherheitsproblem (intern nur über Tailscale erreichbar).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-test
  namespace: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`test.svc.johannesmoseler.de`)
      kind: Rule
      services:
        - name: whoami-test
          port: 80
  tls:
    secretName: svc-wildcard-tls
