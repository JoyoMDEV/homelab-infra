---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-pg-pgsodium-getkey
  namespace: supabase
data:
  # NOTE: `openssl` is not installed in the supabase/postgres image
  # (confirmed live: `sh: openssl: not found`) - use the same
  # od/tr-based approach the image's own default getkey script uses
  # instead (see /usr/lib/postgresql/bin/pgsodium_getkey.sh in the image).
  pgsodium_getkey.sh: |
    #!/bin/sh
    set -eu
    KEY_FILE=/var/lib/postgresql/data/pgdata/.pgsodium_root.key
    if [ ! -f "$KEY_FILE" ]; then
      umask 277
      head -c 32 /dev/urandom | od -A n -t x1 | tr -d ' \n' > "$KEY_FILE"
    fi
    cat "$KEY_FILE"

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: supabase-pg
  namespace: supabase
spec:
  instances: 1

  # Not CNPG's own default image - Supabase's schema/migrations need
  # extensions (pgjwt, pgsodium, pg_graphql, pg_net, pg_cron) that aren't in
  # CNPG's default postgres image. supabase/postgres is a superset build of
  # standard postgres (same binaries/paths), so it's structurally compatible
  # with CNPG's instance manager. See scripts/setup-supabase.sh for the
  # schema bootstrap this enables.
  imageName: supabase/postgres:17.6.1.136

  # supabase/postgres runs its "postgres" user as UID/GID 100/101 (verified
  # live via `getent passwd postgres` in the image), not CNPG's own default
  # of 26 - without this, CNPG's initdb bootstrap fails with "could not look
  # up effective user ID 26: user does not exist".
  postgresUID: 100
  postgresGID: 101

  # pgsodium/supabase_vault need a stable master key, fetched at postgres
  # startup by executing a script whose *path* pgsodium.getkey_script names
  # (confirmed live: pgsodium execs the value directly and fails with
  # `The getkey script "..." does not exists` if it's a shell one-liner
  # instead of a real file - it's not run via `sh -c`). The image's own
  # default script writes its key under /etc/postgresql-custom/, which is on
  # the image's read-only root filesystem in this CNPG pod (confirmed live:
  # `touch` there fails with "Read-only file system") - CNPG never mounts
  # that path writable, unlike a plain Docker Compose run of this image.
  # This ConfigMap+projectedVolumeTemplate ships our own copy of that script
  # at a path CNPG does mount (read-only, but the script itself only needs
  # to be exec'd, not written to); the script writes the actual key material
  # into PGDATA (read-write, Barman-backed), so the key - and therefore
  # every vault-encrypted secret - survives restarts and restores instead of
  # being silently regenerated.
  projectedVolumeTemplate:
    defaultMode: 0o755
    sources:
      - configMap:
          name: supabase-pg-pgsodium-getkey

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      max_connections: "100"
      pgsodium.getkey_script: /projected/pgsodium_getkey.sh
      vault.getkey_script: /projected/pgsodium_getkey.sh
    # supabase/postgres's own postgresql.conf preloads these (confirmed live
    # via `SHOW shared_preload_libraries` / grep on /etc/postgresql/postgresql.conf
    # inside the image) so pg_cron, pg_net, pgsodium, and supabase_vault can
    # even be CREATE EXTENSION'd, and pg_stat_statements can collect stats.
    # CNPG manages postgresql.conf itself and starts from an empty list -
    # the image's own default is silently lost otherwise, which is why a
    # freshly CNPG-bootstrapped supabase-pg had none of these extensions
    # available despite the migrations "creating" them (discovered live,
    # 2026-09-14).
    shared_preload_libraries:
      - pg_stat_statements
      - pgaudit
      - plpgsql
      - plpgsql_check
      - pg_cron
      - pg_net
      - pgsodium
      - auto_explain
      - pg_tle
      - plan_filter
      - supabase_vault

  storage:
    size: 10Gi

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi

  bootstrap:
    initdb:
      # Supabase's own init SQL expects a role named "supabase_admin" to
      # already exist so it can ALTER it to superuser - CNPG's bootstrap
      # owner becomes that role. All of Supabase's components connect to
      # the single "postgres" database (matching upstream's own self-host
      # default), not a separately-named database.
      database: postgres
      owner: supabase_admin

  # ── Backup via Barman + the existing MinIO (ops plumbing, not product
  # storage - unrelated to the Garage-vs-MinIO decision for Supabase Storage
  # itself) ─────────────────────────────────────────────────────────────────
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/supabase-pg/
      endpointURL: http://minio.infrastructure.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-secret
          key: rootUser
        secretAccessKey:
          name: minio-secret
          key: rootPassword
      wal:
        compression: gzip
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

---
# Staggered after homelab-pg's 03:00 backup, before restic's 03:30.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: supabase-pg-daily
  namespace: supabase
spec:
  schedule: "15 3 * * *"
  backupOwnerReference: self
  cluster:
    name: supabase-pg
  immediate: false
