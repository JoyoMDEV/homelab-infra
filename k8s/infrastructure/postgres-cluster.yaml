---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab-pg
  namespace: infrastructure
spec:
  instances: 1

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      max_connections: "100"

  storage:
    size: 10Gi

  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi

  bootstrap:
    initdb:
      database: homelab
      owner: homelab

  # ── Backup via Barman + Garage ─────────────────────────────────────────────
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://garage.infrastructure.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: garage-backup-secret
          key: access-key-id
        secretAccessKey:
          name: garage-backup-secret
          key: secret-access-key
        region:
          name: garage-backup-secret
          key: region
      wal:
        compression: gzip
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2
    retentionPolicy: "30d"

---
# Täglicher Backup um 03:00 Uhr – nach Velero (02:00).
# CNPG erwartet 6 Cron-Felder (Sekunden zuerst); mit 5 Feldern lief es stündlich.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: homelab-pg-daily
  namespace: infrastructure
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: homelab-pg
  immediate: false
