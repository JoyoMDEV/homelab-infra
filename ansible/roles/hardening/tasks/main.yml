---
# NUR ausführen, wenn Tailscale auf dem Ziel-Host bereits läuft und
# ansible_host im Inventory auf die Tailscale-IP zeigt (siehe README.md
# in diesem Ordner). Sonst sperrst du dich selbst aus.

- name: Prüfen, dass Tailscale-Interface existiert, bevor wir SSH einschränken
  ansible.builtin.command: tailscale ip -4
  register: tailscale_check
  changed_when: false
  failed_when: tailscale_check.rc != 0 or tailscale_check.stdout == ""

- name: Alte, offene SSH/k3s-API-Regeln entfernen (falls von der common-Rolle noch vorhanden)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    delete: true
  loop:
    - "22"
    - "6443"
  # Löschen einer nicht-existenten Regel ist in UFW kein Fehler, daher kein
  # ignore_errors nötig - das Modul ist idempotent.

- name: SSH auf Tailscale-Interface beschränken
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: "22"
    proto: tcp
    comment: "SSH (Tailscale only)"

- name: k3s-API auf Tailscale-Interface beschränken
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
    port: "6443"
    proto: tcp
    comment: "k3s API (Tailscale only)"
