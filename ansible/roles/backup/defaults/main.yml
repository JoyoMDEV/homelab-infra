---
# ── Samba Backup ──────────────────────────────────────────────────────────────
backup_dir: /backup/samba
backup_retention_days: 7   # Lokale Retention auf dem Host

# ── Garage S3 ─────────────────────────────────────────────────────────────────
# Fixed ClusterIP Service garage-s3-host (k8s/infrastructure/garage-s3-host-service.yaml),
# reachable from every k3s node host through kube-proxy.
backup_s3_endpoint: "http://10.43.0.50:3900"
backup_s3_region: garage
backup_s3_bucket: samba-backup
backup_s3_access_key_id: "{{ vault_garage_backup_access_key_id }}"
backup_s3_secret_access_key: "{{ vault_garage_backup_secret_access_key }}"
backup_s3_retention_days: 30

# ── systemd Timer ─────────────────────────────────────────────────────────────
backup_timer_oncalendar: "*-*-* 01:00:00"   # täglich 01:00 Uhr
