---
# ── Backup-Verzeichnis anlegen ────────────────────────────────────────────────
- name: Backup-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ── rclone für den Upload nach Garage ─────────────────────────────────────────
- name: rclone installieren
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
    cache_valid_time: 3600

# ── Backup Script deployen ────────────────────────────────────────────────────
- name: Samba Backup Script deployen
  ansible.builtin.template:
    src: samba-backup.sh.j2
    dest: /usr/local/bin/samba-backup.sh
    owner: root
    group: root
    mode: "0750"

# ── systemd Service deployen ──────────────────────────────────────────────────
- name: Systemd Service für Samba-Backup deployen
  ansible.builtin.template:
    src: samba-backup.service.j2
    dest: /etc/systemd/system/samba-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Systemd Timer für Samba-Backup deployen
  ansible.builtin.template:
    src: samba-backup.timer.j2
    dest: /etc/systemd/system/samba-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Systemd Timer aktivieren und starten
  ansible.builtin.systemd:
    name: samba-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

# ── Ersten manuellen Backup triggern ─────────────────────────────────────────
- name: Ersten manuellen Backup triggern
  ansible.builtin.command:
    cmd: /usr/local/bin/samba-backup.sh
  changed_when: true
  register: backup_first_backup_result
  when: not ansible_check_mode

- name: Backup-Ergebnis anzeigen
  ansible.builtin.debug:
    msg: "{{ backup_first_backup_result.stdout_lines }}"
  when: not ansible_check_mode
