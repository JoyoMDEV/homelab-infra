---
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Control plane since 2026-11-27 (moved from the Hetzner k3s-server,
    # context-hub#35). The node keeps its old name k3s-worker-minipc.
    server:
      hosts:
        k3s-worker-minipc:
          ansible_host: 100.79.105.118
          ansible_user: ubuntu
          k3s_role: server
          location: home

    workers:
      hosts:
        k3s-worker-pi:
          ansible_host: 100.103.167.49
          ansible_user: ubuntu
          k3s_role: agent
          private_ip: 10.0.1.2
          location: home
